name: Deploy Sports Predictor Frontend to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'Dockerfile'
      - 'Caddyfile'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild and deploy even if no changes'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Sports Predictor frontend image
        run: |
          docker build -t ghcr.io/kevocado/sports-predictor:${{ github.sha }} -t ghcr.io/kevocado/sports-predictor:latest .
          docker push ghcr.io/kevocado/sports-predictor:${{ github.sha }}
          docker push ghcr.io/kevocado/sports-predictor:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create / Update Sports Predictor Container App
        env:
          AZURE_RG: predictor-hub-rg
          AZURE_ENV: proudbay-f56b8dfa.eastus2
          APP_NAME: sports-predictor
          IMAGE: ghcr.io/kevocado/sports-predictor:${{ github.sha }}
        run: |
          # Create if doesn't exist (ports 80 for Caddy static serving)
          az containerapp create \
            --name $APP_NAME \
            --resource-group $AZURE_RG \
            --environment $AZURE_ENV \
            --image $IMAGE \
            --target-port 80 \
            --ingress external \
            --min-replicas 0 \
            --max-replicas 3 \
            --cpu 0.25 \
            --memory 0.5Gi \
            --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true

          # Update to latest image
          az containerapp update \
            --name $APP_NAME \
            --resource-group $AZURE_RG \
            --image $IMAGE \
            --min-replicas 0 \
            --max-replicas 3 || true
          az containerapp ingress enable --name $APP_NAME --resource-group $AZURE_RG --type external --target-port 80 || true

      - name: Verify backend endpoints
        run: |
          echo "Verifying NFL and CFB predictor backends are running..."
          echo "NFL: https://nfl-predictor.proudbay-f56b8dfa.eastus2.azurecontainerapps.io/api"
          echo "CFB: https://cfb-predictor.proudbay-f56b8dfa.eastus2.azurecontainerapps.io/api"
          # The frontend auto-detects these URLs at runtime (see src/api/client.ts)
          # No Caddy reverse proxy needed - client connects directly to backends
